# /etc/nginx/fraywick-proxy.conf — shared proxy settings for the FRAYWICK API. Installed by deploy/provision.sh.
# The app trusts X-Real-IP only because TRUST_PROXY=1 is set in the unit and it listens on 127.0.0.1.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
