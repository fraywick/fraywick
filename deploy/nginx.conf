# /etc/nginx/sites-available/fraywick — fraywick.xyz (+ www → apex). Installed by deploy/provision.sh, which substitutes the real DOMAIN
# for "fraywick.xyz" and the API port for PORT_PLACEHOLDER (4891 unless taken, checked with `ss -ltnp`).
# Static site from /srv/fraywick/web (clean URLs) · /api/ and /mcp → Node on 127.0.0.1:PORT_PLACEHOLDER · /snapshots/<epoch>.json → Node
# (serves the stored .json.gz, gzip or plain) · /snapshots/objects/ → files on disk (content-addressed, immutable).
# Writes: POST /api/check (small JSON, rate-limited here and in the app) and POST /mcp (JSON-RPC, rate-limited).
limit_req_zone $binary_remote_addr zone=fraywick_check:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fraywick_mcp:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=fraywick_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name fraywick.xyz www.fraywick.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://fraywick.xyz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.fraywick.xyz;
    ssl_certificate /etc/letsencrypt/live/fraywick.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraywick.xyz/privkey.pem;
    include /etc/nginx/fraywick-headers.conf;
    return 301 https://fraywick.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fraywick.xyz;
    ssl_certificate /etc/letsencrypt/live/fraywick.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraywick.xyz/privkey.pem;

    root /srv/fraywick/web;
    index index.html;
    charset utf-8;
    include /etc/nginx/fraywick-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;

    location = /api/check {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=fraywick_check burst=5 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/fraywick-proxy.conf;
        client_max_body_size 8k;
        proxy_read_timeout 30s;
    }
    location = /mcp {
        limit_except GET POST OPTIONS { deny all; }
        limit_req zone=fraywick_mcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/fraywick-proxy.conf;
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=fraywick_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/fraywick-proxy.conf;
        client_max_body_size 1k;
        proxy_read_timeout 60s;
    }
    location ~ ^/snapshots/[0-9]+\.json$ {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:PORT_PLACEHOLDER;
        include /etc/nginx/fraywick-proxy.conf;
        gzip off;
        proxy_read_timeout 60s;
    }
    location ^~ /snapshots/objects/ {
        alias /srv/fraywick/server/data/snapshots/objects/;
        types { application/json json; text/plain txt; }
        default_type application/octet-stream;
        include /etc/nginx/fraywick-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /snapshots/ { return 404; }

    location = /token.json { include /etc/nginx/fraywick-headers.conf; add_header Cache-Control "no-store" always; try_files $uri =404; }
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /dev/ { return 404; }

    location ^~ /vendor/ {
        include /etc/nginx/fraywick-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(woff2?|png|jpe?g|webp|avif|gif|ico|svg|glb|mp4|webm|wasm)$ { include /etc/nginx/fraywick-headers.conf; add_header Cache-Control "public, max-age=604800" always; try_files $uri =404; }
    location ~* \.(js|mjs|css|json|xml|txt|webmanifest)$ { include /etc/nginx/fraywick-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location / {
        include /etc/nginx/fraywick-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
